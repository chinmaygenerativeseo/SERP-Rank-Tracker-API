services:
  - type: web
    name: serp-rank-tracker-api
    runtime: docker # Changed from python to docker to support ODBC Driver 18 dependencies
    envVars:
      - key: DB_SERVER
        sync: false # User will fill this in Render Dashboard
      - key: DB_PORT
        value: "1433"
      - key: DB_DATABASE
        sync: false # User will fill this in Render Dashboard
      - key: DB_USE_WINDOWS_AUTH
        value: "false"
      - key: DB_USERNAME
        sync: false # User will fill this in Render Dashboard
      - key: DB_PASSWORD
        sync: false # User will fill this in Render Dashboard
      - key: DB_TRUST_SERVER_CERTIFICATE
        value: "yes"
